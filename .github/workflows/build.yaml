name: build-and-deploy

on: 
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: 8.0.x
  BUILD_CONFIGURATION: Release
  PROJECT_PATH: ./ProductCatalogue   
  PUBLISH_PATH: ./myapp
  TESTRESULTS_PATH: ./test-results
  AZURE_WEBAPP_NAME: ThAmCoProductCatalogue  # Updated to match profile name

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dotnet
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Install dependencies
        run: dotnet restore
      
      - name: Build code
        run: dotnet build --configuration $BUILD_CONFIGURATION --no-restore
      
      - name: Run unit tests
        run: dotnet test --configuration $BUILD_CONFIGURATION --no-build --logger trx --results-directory $TESTRESULTS_PATH
      
      - name: Store test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.TESTRESULTS_PATH }}
        if: ${{ always() }}
      
      - name: Package build
        run: dotnet publish $PROJECT_PATH --configuration $BUILD_CONFIGURATION --no-build --output $PUBLISH_PATH
      
      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef
      
      - name: Setup SQL Server migration
        run: |
          # Create a temporary version of Program.cs for SQL Server
          cp $PROJECT_PATH/Program.cs $PROJECT_PATH/Program.cs.bak
          sed -i 's/var folder = Environment.SpecialFolder.LocalApplicationData;/\/\/ Temporarily commented for migration script/g' $PROJECT_PATH/Program.cs
          sed -i 's/var path = Environment.GetFolderPath(folder);/\/\/ Temporarily commented for migration script/g' $PROJECT_PATH/Program.cs
          sed -i 's/var dbPath = System.IO.Path.Join(path, "products.db");/\/\/ Temporarily commented for migration script/g' $PROJECT_PATH/Program.cs
          sed -i 's/options.UseSqlite($"Data Source={dbPath}");/options.UseSqlServer("Server=dummyserver;Database=dummydb;User Id=dummy;Password=dummy;");/g' $PROJECT_PATH/Program.cs
      
      - name: Generate migration SQL script
        run: dotnet ef migrations script --idempotent --project $PROJECT_PATH --context ProductsContext --output migration.sql
      
      - name: Restore original Program.cs
        run: mv $PROJECT_PATH/Program.cs.bak $PROJECT_PATH/Program.cs
      
      - name: Store build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: ${{ env.PUBLISH_PATH }}
      
      - name: Store SQL script artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-migration
          path: migration.sql
  
  deploy-database:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download migration script
        uses: actions/download-artifact@v4
        with:
          name: db-migration
      
      - name: Install SQL Server tools
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/20.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools unixodbc-dev
      
      - name: Apply database migrations
        run: |
          echo "Applying migrations to Azure SQL Database..."
          /opt/mssql-tools/bin/sqlcmd \
            -S ${{ secrets.SQL_SERVER }} \
            -d ${{ secrets.DATABASE_NAME }} \
            -U ${{ secrets.SQL_USERNAME }} \
            -P ${{ secrets.SQL_PASSWORD }} \
            -i migration.sql
  
  deploy-webapp:
    needs: deploy-database
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ${{ env.PUBLISH_PATH }}
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ThAmCoProductCatalogue  # Updated to match profile name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_PATH }}
      
      - name: Trigger product sync
        run: |
          # Wait for app to start
          sleep 15
           curl -X POST https://thamcoproductcatalogue-cuc2dzgkb9e3ehej.uksouth-01.azurewebsites.net/debug/sync-all-products